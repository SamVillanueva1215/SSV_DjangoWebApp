<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>
    <h2>Student List</h2>
    <a href="{% url 'student_create' %}">Register Student</a>
    <br><br>
    <ul>
        {% for student in students %}
            <li>
                {{ student.student_name }} - {{ student.program }} (Year {{ student.year_level }}) - {{ student.email }}
                | <a href="{% url 'student_update' student.pk %}">Edit</a>
                | <a href="{% url 'student_delete' student.pk %}">Delete</a>
            </li>
        {% empty %}
            <li>No registered students found.</li>
        {% endfor %}
    </ul>
</body>
</html>
